# OSPS Baseline evaluation (Level 1) using the OpenSSF pvtr-github-repo-scanner.
name: OSPS Baseline

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly, Mondays 09:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a scan partway through; let the running one finish
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSPS Baseline scan
        uses: revanite-io/osps-baseline-action@1af7ff8b44af83f120b20cc5f63b877286849257 # v1.5.2
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          token: ${{ github.token }}
          catalog: "osps-baseline-2026-08"
          # Known failing controls are tracked separately; don't turn the
          # default branch red for them.
          fail-on-error: "false"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osps-baseline-results-${{ github.run_number }}
          path: evaluation_results/
          retention-days: 30
