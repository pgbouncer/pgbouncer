[databases]
p0 = port=6666 host=127.0.0.1 dbname=p0 user=bouncer pool_size=2 reserve_pool_size=2

tsa_primary = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=primary
tsa_standby = port=6666 host=/tmp,/tmp/pgbouncer-test-replica dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=standby
tsa_read_write = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=read-write
tsa_read_only = port=6666 host=/tmp,/tmp/pgbouncer-test-replica dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=read-only
tsa_read_only_primary = port=6666 host=127.0.0.1 dbname=p0 user=bouncer target_session_attrs=read-only
tsa_primary_read_only = port=6666 host=127.0.0.1 dbname=p0 user=bouncer target_session_attrs=primary
tsa_read_write_primary = port=6666 host=127.0.0.1 dbname=p0 user=bouncer target_session_attrs=read-write
tsa_replication_read_write = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=postgres load_balance_hosts=disable target_session_attrs=read-write
tsa_connect_query = port=6666 host=127.0.0.1 dbname=p0 user=bouncer connect_query='SET default_transaction_read_only=on' target_session_attrs=read-only
tsa_any = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=any
tsa_default_any = port=6666 host=/tmp,/tmp/pgbouncer-test-replica dbname=p0 user=bouncer pool_size=2
tsa_retry_primary = port=6666 host=/tmp,/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer target_session_attrs=primary
tsa_mixed_failure = port=6666 host=/tmp,/tmp/pgbouncer-test-missing,/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer target_session_attrs=primary
tsa_all_mismatch = port=6666 host=/tmp/pgbouncer-test-replica,/tmp/pgbouncer-test-replica dbname=p0 user=bouncer target_session_attrs=primary
tsa_version_any = port=6666 host=127.0.0.1 dbname=p0 user=bouncer target_session_attrs=any
tsa_version_primary = port=6666 host=127.0.0.1 dbname=p0 user=bouncer target_session_attrs=primary
tsa_reload = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=any
tsa_takeover = port=6666 host=/tmp/pgbouncer-test-replica,/tmp dbname=p0 user=bouncer load_balance_hosts=disable target_session_attrs=any

[pgbouncer]
logfile = test.log
pidfile = test.pid

listen_addr = 127.0.0.1
listen_port = 6667
unix_socket_dir = /tmp

auth_type = trust
auth_file = userlist.txt

pool_mode = statement

server_check_delay = 10
max_client_conn = 10
default_pool_size = 5

server_lifetime = 120
server_idle_timeout = 60

tcp_defer_accept = 0
tcp_keepalive = 0

; use a small tcp_socket_buffer so that we trigger EAGAIN more often in tests.
; Otherwise bugs caused by EAGAIN are hard to debug.
tcp_socket_buffer = 4096

;track_extra_parameters is case sensitive.
;bgbouncer will only track the parameters with GUC_REPORT flag set in Postgres
track_extra_parameters = search_path, intervalstyle, default_transaction_read_only
ignore_startup_parameters = extra_float_digits
